<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>M Express | Dispatch</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202328;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#161a20;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}header strong{color:#f7a735;font-size:21px}main{max-width:1200px;margin:30px auto;padding:0 20px}section{background:white;border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 2px 14px #17222e0a}input,select,button{font:inherit;padding:10px;border:1px solid #c9ced6;border-radius:7px}input{width:100%}button{cursor:pointer;background:#ee951f;color:#151515;border:0;font-weight:700}button:disabled{opacity:.5}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:600}form{max-width:380px}.muted{color:#667080}.error{color:#ae2534}.success{color:#17663a}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7e9ee;vertical-align:top;font-size:13px}th{color:#586272;background:#fafafa}td input{min-width:95px}td select{min-width:130px}small{display:block;color:#667080;margin-top:5px}.hidden{display:none}#login-error,#notice{min-height:20px} .pill{display:inline-block;border-radius:20px;background:#fff1d9;padding:5px 9px}a{color:#ad670a}</style></head>
<body><header><strong>M EXPRESS <span style="color:white">DISPATCH</span></strong><button id="logout" class="hidden">Sign out</button></header><main>
<section id="login-panel"><h2>Dispatcher sign in</h2><p class="muted">Authorized M Express staff only.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit" id="login-button">Sign in</button></p><p id="login-error" class="error" role="alert"></p></form></section>
<section id="dashboard" class="hidden"><div class="toolbar"><div><h2>Ride requests</h2><p class="muted">Review requests, set price, and assign drivers.</p></div><button id="refresh">Refresh trips</button></div><p id="notice" role="status"></p><div class="table-wrap"><table><thead><tr><th>Pickup</th><th>Passenger</th><th>Route</th><th>Trip</th><th>Status</th><th>Price ($)</th><th>Driver</th><th>Action</th></tr></thead><tbody id="trips"></tbody></table></div></section>
</main><script type="module" src="/dispatch.js"></script></body></html>
